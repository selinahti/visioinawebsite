<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% include mark.svg %}
      <span>Visioina</span>
      {%- if page.brand_sub %}<span class="sub">{{ page.brand_sub }}</span>{% endif %}
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"
         {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
