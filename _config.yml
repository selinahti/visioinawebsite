# Visioina — site configuration
#
# Editing tips:
#   • company details below appear in the footer of every page
#   • when the custom domain goes live, set baseurl to "" and url to the domain
#     (see README.md, "Connecting the domain")

title: Visioina
tagline: Finnish app studio — delightful apps and games.
description: >-
  Visioina is an independent app studio in Espoo, Finland, making
  apps and games that are useful, playful and built with care.

# --- URLs -------------------------------------------------------------------
# The custom domain is live, so the site is served from the root of
# visioina.com and baseurl stays empty. The CNAME file in the repository root
# is what tells GitHub Pages which domain to answer on.
url: "https://visioina.com"
baseurl: ""

# --- Company details (shown in the footer and on /contact/) -----------------
company:
  legal_name: "Visioina Oy"
  business_id: "3352691-4"
  city: "Espoo"
  country: "Finland"
  email: "visioina@gmail.com"

# --- Build ------------------------------------------------------------------
collections:
  apps:
    output: true

defaults:
  # Everything under _apps/ gets the dark space theme automatically, so a new
  # app folder needs no theme setting of its own.
  - scope: { path: "", type: "apps" }
    values:
      layout: app-doc
      theme: space

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
